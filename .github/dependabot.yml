version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
